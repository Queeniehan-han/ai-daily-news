services:
  - type: web
    name: ai-news-max
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MODEL_PROVIDER
        value: OpenRouter
      - key: MODEL_API_KEY
        sync: false
