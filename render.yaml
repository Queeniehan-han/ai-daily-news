services:
  - type: web
    name: ai-news-max
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-news-max-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: MODEL_PROVIDER
        value: Bytedance ModelHub
      - key: MODEL_NAME
        value: gemini-3.5-flash
      - key: MODEL_API_KEY
        sync: false

databases:
  - name: ai-news-max-db
    plan: starter

